name: Evidence Ledger tests

on:
  push:
    paths:
      - "evidence_ledger.py"
      - "pyproject.toml"
      - "README.md"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/evidence-ledger-tests.yml"
  pull_request:
    paths:
      - "evidence_ledger.py"
      - "pyproject.toml"
      - "README.md"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/evidence-ledger-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python evidence_ledger.py check examples/demo.json
